<!DOCTYPE html>
<html>
  <head>
    <title>iframe-dark fixture</title>
    <style>
      body { background: #ffffff; color: #000000; margin: 0; }
      iframe { display: block; width: 300px; height: 150px; border: 0; }
    </style>
  </head>
  <body>
    <p>Top page embedding a built-in-dark page and a cross-origin light page.</p>
    <iframe id="same" src="/dark-bg.html"></iframe>
    <iframe id="cross" src="http://localhost:4181/light.html"></iframe>
  </body>
</html>
